apiVersion: 1

# Provisioned data sources — created automatically on Grafana startup so the
# dashboards below can reference them by fixed UID (no manual setup needed).
datasources:
  - name: Prometheus
    type: prometheus
    uid: pulse-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    uid: pulse-loki
    access: proxy
    url: http://loki:3100
    editable: true
