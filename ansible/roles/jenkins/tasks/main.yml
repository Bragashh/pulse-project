---
# ── Base packages ────────────────────────────────────────────────────────────
- name: Install base packages (Java, tools, Docker, pip)
  apt:
    name:
      - openjdk-21-jre-headless    
      - curl
      - gnupg
      - ca-certificates
      - docker.io
      - git
      - python3-pip
      - python3-venv
      - unzip
    state: present
    update_cache: yes
 
- name: Ensure Docker is running
  service:
    name: docker
    state: started
    enabled: yes
 
- name: Install AWS CLI v2
  shell: |
    cd /tmp
    curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
    unzip -o -q awscliv2.zip
    ./aws/install --update
  args:
    creates: /usr/local/bin/aws
 
# ── Jenkins repository + install ──────────────────────────────────────────────
- name: Discover the latest Jenkins LTS .deb filename
  shell: |
    curl -fsSL https://get.jenkins.io/debian-stable/ \
      | grep -oP 'jenkins_[0-9.]+_all\.deb' | sort -V | tail -1
  register: jenkins_deb_name
  changed_when: false
 
- name: Download the Jenkins LTS .deb
  get_url:
    url: "https://get.jenkins.io/debian-stable/{{ jenkins_deb_name.stdout }}"
    dest: /tmp/jenkins.deb
    mode: '0644'
 
- name: Install Jenkins from the .deb (pulls deps if needed)
  apt:
    deb: /tmp/jenkins.deb
    state: present
 
- name: Stop Jenkins before reconfiguring
  service:
    name: jenkins
    state: stopped
 
- name: Remove first-run wizard state files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/jenkins/secrets/initialAdminPassword
    - /var/lib/jenkins/jenkins.install.UpgradeWizard.state
    - /var/lib/jenkins/jenkins.install.InstallUtil.lastExecVersion
 
# ── Skip the setup wizard ─────────────────────────────────────────────────────
- name: Disable the Jenkins setup wizard
  lineinfile:
    path: /usr/lib/systemd/system/jenkins.service
    regexp: '^Environment="JAVA_OPTS'
    line: 'Environment="JAVA_OPTS=-Djenkins.install.runSetupWizard=false"'
    insertafter: '^\[Service\]'
 
- name: Point Jenkins explicitly at Java 21
  # Java 17 may still be the system default; the current Jenkins LTS needs 21.
  lineinfile:
    path: /usr/lib/systemd/system/jenkins.service
    regexp: '^Environment="JENKINS_JAVA_CMD'
    line: 'Environment="JENKINS_JAVA_CMD=/usr/lib/jvm/java-21-openjdk-amd64/bin/java"'
    insertafter: '^\[Service\]'
 
- name: Add jenkins user to the docker group
  user:
    name: jenkins
    groups: docker
    append: yes
 
# ── Place plugins + Groovy scripts BEFORE starting Jenkins ────────────────────
- name: Create the Jenkins plugins directory
  file:
    path: /var/lib/jenkins/plugins
    state: directory
    owner: jenkins
    group: jenkins
    mode: '0755'
 
- name: Download jenkins-plugin-manager (resolves plugin dependencies offline)
  get_url:
    url: "https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/2.13.2/jenkins-plugin-manager-2.13.2.jar"
    dest: /tmp/jenkins-plugin-manager.jar
    mode: '0644'
 
- name: Locate the Jenkins war
  shell: |
    for p in /usr/share/java/jenkins.war /usr/lib/jenkins/jenkins.war /usr/share/jenkins/jenkins.war; do
      [ -f "$p" ] && echo "$p" && exit 0
    done
    exit 1
  register: jenkins_war_path
  changed_when: false
 
- name: Install plugins with jenkins-plugin-cli (resolves dependencies)
  command: >
    java -jar /tmp/jenkins-plugin-manager.jar
    --war {{ jenkins_war_path.stdout }}
    --plugin-download-directory /var/lib/jenkins/plugins
    --plugins {{ jenkins_plugins | join(' ') }}
  register: plugin_cli
  changed_when: plugin_cli.rc == 0
  failed_when: plugin_cli.rc != 0
 
- name: Ensure plugins are owned by jenkins
  file:
    path: /var/lib/jenkins/plugins
    state: directory
    owner: jenkins
    group: jenkins
    recurse: yes
 
- name: Create Jenkins init.groovy.d directory
  file:
    path: /var/lib/jenkins/init.groovy.d
    state: directory
    owner: jenkins
    group: jenkins
    mode: '0755'
 
- name: Install admin-user bootstrap script
  template:
    src: basic-security.groovy.j2
    dest: /var/lib/jenkins/init.groovy.d/basic-security.groovy
    owner: jenkins
    group: jenkins
    mode: '0644'
 
- name: Install seed-job bootstrap script
  template:
    src: seed-job.groovy.j2
    dest: /var/lib/jenkins/init.groovy.d/seed-job.groovy
    owner: jenkins
    group: jenkins
    mode: '0644'
 
- name: Reload systemd after unit change
  systemd:
    daemon_reload: yes
 
- name: Enable and start Jenkins (plugins + scripts already in place)
  service:
    name: jenkins
    state: restarted
    enabled: yes
 
- name: Wait for Jenkins to come up on port {{ jenkins_http_port }}
  wait_for:
    port: "{{ jenkins_http_port }}"
    delay: 20
    timeout: 240
 
- name: Show where Jenkins is reachable
  debug:
    msg: "Jenkins is up. Log in at http://{{ ansible_host | default(inventory_hostname) }}:{{ jenkins_http_port }} with user '{{ jenkins_admin_user }}'."
 