<svg viewBox="0 0 1060 720" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <style>
      .bg     { fill: #0d1117; }
      .lane   { fill: #11161d; stroke: #30363d; stroke-width: 1; }
      .laneaws{ fill: #15130c; stroke: #9e6a03; stroke-width: 1.5; }
      .box    { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
      .boxk   { fill: #0f1a14; stroke: #2ea043; stroke-width: 1.5; }
      .boxobs { fill: #1a1410; stroke: #d29922; stroke-width: 1.5; }
      .boxaws { fill: #1c1407; stroke: #d29922; stroke-width: 1.5; }
      .title  { fill: #e6edf3; font-weight: 700; }
      .label  { fill: #e6edf3; font-size: 13px; font-weight: 600; }
      .sub    { fill: #8b949e; font-size: 11px; }
      .lane-l { fill: #6e7681; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
      .flowb  { stroke: #58a6ff; stroke-width: 2.5; fill: none; }
      .flowg  { stroke: #3fb950; stroke-width: 2; fill: none; }
      .flowo  { stroke: #d29922; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
      .arrowb { fill: #58a6ff; } .arrowg { fill: #3fb950; } .arrowo { fill: #d29922; }
      .bridge { fill: #1f6feb; font-size: 11px; font-weight: 700; }
    </style>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" class="arrowb"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" class="arrowg"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" class="arrowo"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1060" height="720"/>
  <text x="40" y="42" class="title" font-size="22">Pulse — Connected CI/CD Flow</text>
  <text x="40" y="64" class="sub" font-size="12">Jenkins builds + tests on AWS → archives the image → the local deploy script pulls that exact image and runs it on k3s</text>

  <!-- ===== AWS side ===== -->
  <text x="40" y="104" class="lane-l">AWS — provisioned by Terraform, configured by Ansible</text>
  <rect class="laneaws" x="40" y="116" width="470" height="300" rx="10"/>

  <rect class="box" x="64" y="140" width="200" height="60" rx="8"/>
  <text x="84" y="165" class="label">Terraform</text>
  <text x="84" y="183" class="sub">creates the EC2 (no EIP)</text>

  <rect class="box" x="288" y="140" width="200" height="60" rx="8"/>
  <text x="308" y="165" class="label">Ansible</text>
  <text x="308" y="183" class="sub">installs + configures Jenkins</text>

  <rect class="boxaws" x="64" y="230" width="424" height="160" rx="8"/>
  <text x="84" y="255" class="label">Jenkins pipeline (port 8080)</text>
  <text x="84" y="284" class="sub">1 · checkout the repo</text>
  <text x="84" y="306" class="sub">2 · build the Docker images</text>
  <text x="84" y="328" class="sub">3 · run the 66 backend tests</text>
  <text x="84" y="350" class="sub">4 · on success: docker save → archive image.tar</text>
  <text x="84" y="372" class="sub">    (red build = nothing archived)</text>

  <path class="flowo" d="M264,170 L286,170" marker-end="url(#ao)"/>
  <path class="flowo" d="M276,200 C276,214 200,218 180,228" marker-end="url(#ao)"/>

  <!-- ===== Bridge ===== -->
  <text x="540" y="270" class="bridge">deploy-local.sh</text>
  <text x="540" y="286" class="sub">checks build = SUCCESS</text>
  <text x="540" y="300" class="sub">downloads image.tar</text>
  <text x="540" y="314" class="sub">over the Jenkins API</text>
  <path class="flowb" d="M490,300 L700,300" marker-end="url(#ab)"/>
  <text x="556" y="338" class="sub">no green build → refuses to deploy</text>

  <!-- ===== Local side ===== -->
  <text x="710" y="104" class="lane-l">LOCAL — your machine / VM</text>
  <rect class="lane" x="710" y="116" width="310" height="470" rx="10"/>

  <rect class="box" x="734" y="230" width="262" height="70" rx="8"/>
  <text x="754" y="256" class="label">docker load + k3s import</text>
  <text x="754" y="276" class="sub">image goes into k3s containerd</text>
  <text x="754" y="290" class="sub">(imagePullPolicy: Never)</text>

  <rect class="boxk" x="734" y="320" width="262" height="90" rx="8"/>
  <text x="754" y="346" class="label">k3s — url-shortener</text>
  <text x="754" y="368" class="sub">runs the exact image Jenkins</text>
  <text x="754" y="384" class="sub">built and tested · + Redis</text>

  <rect class="box" x="734" y="430" width="262" height="60" rx="8"/>
  <text x="754" y="455" class="label">Pulse app + monitoring</text>
  <text x="754" y="473" class="sub">backend (process) · Grafana/Prometheus/Loki</text>

  <path class="flowb" d="M820,300 L820,318" marker-end="url(#ab)"/>
  <path class="flowg" d="M820,410 L820,428" marker-end="url(#ag)"/>

  <!-- bottom note -->
  <rect class="box" x="40" y="610" width="980" height="64" rx="8"/>
  <text x="60" y="636" class="label">The dependency is real</text>
  <text x="60" y="656" class="sub">k3s only runs an image that Jenkins built and tested. If the pipeline is red, there is no artifact, and deploy-local.sh refuses. GitHub Actions also runs the 66 tests on every push.</text>
</svg>
